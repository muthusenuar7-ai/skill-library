<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datacense | AI Skill Library</title>
<!--
  DATACENSE AI SKILL LIBRARY - Version 1.2 (standalone, works offline)

  TWO EDITIONS, ONE LIBRARY
  - ADMIN edition (this file's "-admin" version): + Add Resource, bulk import, Manage Resources, backup and restore.
    Your work is saved in this browser (IndexedDB). When you are ready, open Manage Resources and choose
    "Publish for Users". That downloads the USER edition with your library built in.
  - USER edition (datacense-ai-skill-library.html): browse, search, filter, preview and download only. No admin tools.
    Share this file with your team. It does not read or change anything in the admin's browser.

  SAMPLE RESOURCES (advanced)
  The built-in sample resources live in the SKILLS array in the script section marked "SKILL DATA".
  Inside markdownContent write a backtick as \` and the two characters ${ as \${ .

  THIRD-PARTY CODE
  fflate (ZIP reading and writing) is bundled below. Its MIT license text is included before the library.
-->
<style>
  :root {
    /* Datacense palette: Emerald Ink, Champagne, Amber Glow, Sage Green, Walnut Brown */
    --ink: #064E3B;            /* Emerald Ink */
    --ink-2: #0A6149;
    --amber: #D5851F;          /* Amber Glow */
    --amber-strong: #B8700F;
    --on-amber: #2B1B0E;
    --champagne: #F8E7C9;      /* Champagne */
    --champagne-ink: #7A4A0C;
    --sage: #87A96B;           /* Sage Green */
    --sage-tint: #E1EBD3;
    --walnut: #5A3E2B;         /* Walnut Brown */
    --bg: #FAF3E4;
    --card: #ffffff;
    --text: #3A2A1E;
    --muted: #6B5848;
    --border: #E9DDC5;
    --line: #C9BA98;
    --danger-bg: #fdecea;
    --danger-ink: #8a1c13;
    --danger: #c0392b;
    --warn-bg: #FFF1CC;
    --warn-ink: #7a5300;
    --ok-bg: #E1EBD3;
    --ok-ink: #2D5016;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(58, 42, 30, .07), 0 4px 14px rgba(58, 42, 30, .08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  body.modal-open { overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--amber-strong); outline-offset: 2px; }
  .app-header :focus-visible { outline-color: var(--amber); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .skip-link {
    position: absolute; left: 8px; top: -48px; z-index: 100;
    background: var(--amber); color: var(--on-amber); padding: 8px 14px; border-radius: 8px; font-weight: 600;
  }
  .skip-link:focus { top: 8px; }

  /* ---------- Header ---------- */
  .app-header { background: var(--ink); color: var(--champagne); }
  .app-header .inner {
    max-width: 1280px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .brand-mark {
    width: 12px; height: 28px; border-radius: 3px;
    background: linear-gradient(180deg, var(--sage), var(--amber));
    flex: none;
  }
  .app-header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: .2px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .brand-name { color: var(--champagne); }
  .brand-divider { color: rgba(248, 231, 201, .4); font-weight: 300; }
  .brand-product { color: var(--sage); font-weight: 600; }

  .demo-notice { background: var(--ink-2); color: var(--champagne); font-size: .875rem; }
  .demo-notice p { max-width: 1280px; margin: 0 auto; padding: 8px 24px; }
  .demo-notice strong { color: var(--sage); }
  .storage-banner { background: var(--warn-bg); color: var(--warn-ink); border-bottom: 1px solid #EBCF86; font-size: .9375rem; }
  .storage-banner p { max-width: 1280px; margin: 0 auto; padding: 10px 24px; }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1280px; margin: 0 auto; padding: 24px;
    display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start;
  }
  .sidebar {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px; position: sticky; top: 16px;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .sidebar h2 {
    margin: 4px 10px 10px; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  }
  .sidebar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .cat {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--text);
    text-align: left; cursor: pointer;
  }
  .cat:hover { background: var(--bg); }
  .cat .count {
    min-width: 28px; padding: 1px 8px; border-radius: 999px; text-align: center;
    background: var(--bg); color: var(--muted); font-size: .8125rem; font-weight: 600;
  }
  .cat.is-active { background: var(--sage-tint); color: var(--ink); font-weight: 700; box-shadow: inset 4px 0 0 var(--amber); }
  .cat.is-active .count { background: #fff; color: var(--ink); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 20px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 16px; align-items: center;
  }
  .toolbar h2 { margin: 0; font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
  .toolbar .meta { margin: 2px 0 0; color: var(--muted); font-size: .9375rem; }
  .search-wrap { grid-column: 1; }
  .search-wrap input {
    width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--text);
  }
  .search-wrap input:focus-visible { outline-offset: 0; border-color: var(--amber-strong); }
  .tool-actions { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-self: center; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border-radius: 10px; border: 1px solid transparent;
    font-weight: 600; font-size: .9375rem; cursor: pointer; white-space: nowrap; background: transparent;
  }
  .btn-primary { background: var(--amber); color: var(--on-amber); }
  .btn-primary:hover { background: #E3A04A; }
  .btn-secondary { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { background: var(--bg); }
  .btn-dark { background: var(--ink); color: var(--champagne); }
  .btn-dark:hover { background: var(--ink-2); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #a93226; }
  .btn-sm { padding: 5px 10px; font-size: .8125rem; border-radius: 8px; }
  .btn[aria-disabled="true"], .btn:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-height: 210px;
  }
  .card h3 { margin: 0; font-size: 1.0625rem; line-height: 1.3; overflow-wrap: anywhere; }
  .card p { margin: 0; color: var(--muted); flex: 1; overflow-wrap: anywhere; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: var(--champagne); color: var(--champagne-ink); font-size: .8125rem; font-weight: 600;
  }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); font-size: .75rem; font-weight: 600;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .empty {
    background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 40px 24px; text-align: center; color: var(--muted);
  }
  .empty strong { display: block; color: var(--text); font-size: 1.125rem; margin-bottom: 4px; }

  /* ---------- Dialogs ---------- */
  dialog.dlg {
    border: 0; border-radius: 16px; padding: 0; width: min(860px, calc(100vw - 32px));
    max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
    color: var(--text); background: #fff; box-shadow: 0 20px 60px rgba(6, 40, 30, .35);
  }
  dialog.dlg[open] { display: flex; flex-direction: column; }
  dialog.dlg::backdrop { background: rgba(6, 40, 30, .62); }
  dialog.dlg-wide { width: min(1180px, calc(100vw - 24px)); }
  dialog.dlg-small { width: min(520px, calc(100vw - 32px)); }
  .dlg-head { padding: 18px 26px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dlg-head h2 { margin: 0; font-size: 1.35rem; line-height: 1.25; }
  .dlg-body { padding: 20px 26px; overflow: auto; flex: 1; background: #FDFAF3; }
  .dlg-foot {
    padding: 14px 26px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: flex-end; align-items: center; background: #fff;
  }
  .dlg-foot .spacer { flex: 1; }
  .lead { margin: 0 0 14px; color: var(--muted); }
  .icon-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .icon-btn:hover { background: var(--bg); }

  .pv-head { padding: 22px 26px 16px; border-bottom: 1px solid var(--border); }
  .pv-head h2 { margin: 8px 0 6px; font-size: 1.5rem; line-height: 1.25; overflow-wrap: anywhere; }
  .pv-head p { margin: 0; color: var(--muted); }
  .pv-body { padding: 20px 26px; overflow: auto; flex: 1; background: #FDFAF3; }
  .pv-files { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
  .pv-files h3 { margin: 0 0 6px; font-size: 1rem; }
  .pv-files ul { margin: 0; padding-left: 1.3em; font-family: var(--mono); font-size: .85rem; columns: 2; }
  .pv-foot {
    padding: 14px 26px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: flex-end; background: #fff;
  }

  /* choice cards */
  .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .choice {
    text-align: left; background: #fff; border: 2px solid var(--border); border-radius: var(--radius);
    padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
  }
  .choice:hover { border-color: var(--amber); background: var(--champagne); }
  .choice strong { font-size: 1.15rem; color: var(--ink); }
  .choice span { color: var(--muted); }

  /* forms */
  .field { margin-bottom: 16px; }
  .field > label, .field > .lbl { display: block; font-weight: 600; margin-bottom: 5px; }
  .req { color: var(--danger); }
  .field input[type="text"], .field select, .field textarea, .inline-input, .tbl select, .tbl input[type="text"], .tools select, .tools input[type="search"] {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .field textarea { font-family: var(--mono); font-size: .9rem; min-height: 240px; resize: vertical; line-height: 1.45; }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline-offset: 0; border-color: var(--amber-strong); }
  .field .help { color: var(--muted); font-size: .875rem; margin-top: 4px; }
  .field .err { color: var(--danger-ink); font-size: .875rem; margin-top: 4px; min-height: 0; }
  .field .err:empty { display: none; }
  .field.has-error input[type="text"], .field.has-error select, .field.has-error textarea { border-color: var(--danger); }
  .radio-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .radio-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tab { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px 8px 0 0; background: #fff; cursor: pointer; font-weight: 600; font-size: .875rem; }
  .tab[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .md-preview { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: #fff; min-height: 240px; max-height: 420px; overflow: auto; }

  /* import */
  .dropzone {
    border: 2px dashed #B9A987; border-radius: var(--radius); background: #fff; padding: 30px 20px;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .dropzone.is-over { border-color: var(--amber-strong); background: var(--champagne); }
  .dropzone p { margin: 0; color: var(--muted); }
  .dropzone .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .setup-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .setup-box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .setup-box h3 { margin: 0 0 8px; font-size: 1rem; }
  .setup-box label { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; cursor: pointer; }
  .setup-box select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-top: 4px; }
  .privacy { color: var(--muted); font-size: .875rem; margin-top: 12px; }
  .progress-wrap { padding: 30px 6px; text-align: center; }
  .progress { height: 14px; background: #EADFC5; border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .progress .bar { height: 100%; width: 0; background: var(--amber-strong); transition: width .1s linear; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: .8125rem; font-weight: 600; background: #EFE6D0; color: var(--ink); }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .pill.bad { background: var(--danger-bg); color: var(--danger-ink); }
  .notes { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 14px; margin-bottom: 12px; font-size: .875rem; }
  .notes ul { margin: 4px 0 0; padding-left: 1.2em; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .tools .grp { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tools .grp select, .tools .grp input[type="search"] { width: auto; min-width: 150px; padding: 6px 10px; }
  .tools .grp label.t { font-size: .8125rem; color: var(--muted); font-weight: 600; }
  .tbl-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: #fff; max-height: 48vh; }
  table.tbl { border-collapse: collapse; width: 100%; font-size: .875rem; min-width: 860px; }
  .tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  .tbl th { background: #F3EAD6; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
  .tbl select.row-type { min-width: 96px; }
  .tbl select.row-cat { min-width: 140px; }
  .tbl td.fn { font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; max-width: 220px; }
  .tbl select, .tbl input[type="text"] { padding: 5px 8px; font-size: .875rem; }
  .tbl tr.is-invalid td { background: #F7F2E6; color: var(--muted); }
  .st { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: .78rem; font-weight: 700; }
  .st-ok { background: var(--ok-bg); color: var(--ok-ink); }
  .st-warn { background: var(--warn-bg); color: var(--warn-ink); }
  .st-dup { background: #fde8d6; color: #8a3b00; }
  .st-bad { background: var(--danger-bg); color: var(--danger-ink); }
  .hint { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: .875rem; color: var(--muted); }
  .pager .count-note { margin-right: auto; }
  .done-box { text-align: center; padding: 20px 6px; }
  .done-box h3 { margin: 0 0 6px; }
  .dlg-small .dlg-body p { margin: 0 0 10px; }
  .dlg-small label.chk { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }

  /* Rendered Markdown */
  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md h3 { font-size: 1.3rem; margin: 0 0 .6em; color: var(--ink); }
  .md h4 { font-size: 1.1rem; margin: 1.4em 0 .4em; color: var(--ink); padding-bottom: 4px; border-bottom: 2px solid var(--champagne); }
  .md h5 { font-size: 1rem; margin: 1.2em 0 .4em; color: var(--ink); }
  .md h6 { font-size: .9rem; margin: 1.2em 0 .4em; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .md p { margin: 0 0 .8em; }
  .md ul, .md ol { margin: 0 0 .9em; padding-left: 1.5em; }
  .md li { margin: .2em 0; }
  .md code { font-family: var(--mono); font-size: .875em; background: #F1E8D3; padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--ink); color: #F8E7C9; padding: 14px 16px; border-radius: 10px; overflow-x: auto; margin: 0 0 1em; }
  .md pre code { background: none; padding: 0; color: inherit; font-size: .85rem; white-space: pre; }
  .md pre.fm { background: #F3EAD6; color: var(--muted); }
  .md blockquote { margin: 0 0 1em; padding: 6px 14px; border-left: 4px solid var(--amber); background: var(--champagne); border-radius: 0 8px 8px 0; }
  .md blockquote > :last-child { margin-bottom: 0; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
  .md .table-wrap { overflow-x: auto; margin: 0 0 1em; }
  .md table { border-collapse: collapse; width: 100%; font-size: .9375rem; background: #fff; }
  .md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .md th { background: #F3EAD6; }

  /* ---------- Status message ---------- */
  .status {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 2000;
    max-width: min(560px, calc(100vw - 32px)); padding: 12px 18px; border-radius: 10px;
    background: var(--ink); color: var(--champagne); box-shadow: 0 8px 30px rgba(6, 40, 30, .35);
    font-size: .9375rem;
  }
  .status[hidden] { display: none; }
  .status.is-error { background: var(--danger-bg); color: var(--danger-ink); border: 1px solid #f0b8b3; }


  /* ---------- Admin badge, filters ---------- */
  .admin-badge { margin-left: auto; padding: 3px 12px; border-radius: 999px; background: var(--amber); color: var(--on-amber); font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .scope-line { margin: 6px 2px 0; font-size: .875rem; color: var(--muted); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--champagne-ink); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: inherit; }
  .filters { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
  .filters:empty { display: none; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; font-size: .875rem; cursor: pointer; color: var(--text); border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--bg); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--champagne); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips-label { font-size: .8125rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 999px; padding: 5px 13px; font-size: .875rem; font-weight: 600; cursor: pointer; }
  .chip:hover { background: var(--champagne); }
  .chip[aria-pressed="true"] { background: var(--sage-tint); border-color: var(--sage); color: var(--ink); box-shadow: inset 0 0 0 1px var(--sage); }
  .chip .n { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .tag.sub { background: var(--sage-tint); color: var(--ink); border-color: transparent; }
  .field input[list] { width: 100%; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 16px; }
    .sidebar { position: static; padding: 10px; max-height: none; }
    .sidebar h2 { display: none; }
    .sidebar ul { flex-direction: row; overflow-x: auto; padding-bottom: 4px; gap: 6px; }
    .sidebar li { flex: none; }
    .cat { width: auto; background: var(--bg); white-space: nowrap; }
    .app-header .inner, .demo-notice p, .storage-banner p { padding-left: 16px; padding-right: 16px; }
    .toolbar { grid-template-columns: minmax(0, 1fr); }
    .tool-actions { grid-column: 1; grid-row: auto; justify-content: flex-start; }
    .setup-grid, .choice-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .toolbar { padding: 16px; }
    .tool-actions .btn { flex: 1 1 100%; }
    .toolbar h2 { font-size: 1.25rem; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .pv-head, .pv-body, .pv-foot, .dlg-head, .dlg-body, .dlg-foot { padding-left: 16px; padding-right: 16px; }
    .pv-foot .btn, .dlg-foot .btn { flex: 1 1 140px; }
    dialog.dlg { width: calc(100vw - 16px); max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); }
    .pv-files ul { columns: 1; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to skills</a>

<header class="app-header">
  <div class="inner">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>
      <span class="brand-name">Datacense</span>
      <span class="brand-divider" aria-hidden="true">|</span>
      <span class="brand-product">AI Skill Library</span>
    </h1>
    
  </div>
</header>
<div class="demo-notice" id="demo-notice" hidden>
  <p id="demo-notice-text"></p>
</div>
<div class="storage-banner" id="storage-banner" role="alert" hidden><p id="storage-banner-text"></p></div>

<div class="layout">
  <aside class="sidebar">
    <h2 id="cat-heading">Categories</h2>
    <nav id="categories" aria-labelledby="cat-heading"></nav>
  </aside>

  <main id="main" tabindex="-1">
    <section class="toolbar" aria-label="Search and actions">
      <div>
        <h2 id="list-title">All Skills</h2>
        <p class="meta" id="list-count" aria-live="polite"></p>
      </div>
      <div class="tool-actions">
        
        <button type="button" class="btn btn-dark" id="zip-btn">Download All as ZIP</button>
      </div>
      <div class="search-wrap">
        <label class="visually-hidden" for="search">Search all skills</label>
        <input id="search" type="search" placeholder="Search skills and instructions" autocomplete="off">
        <p class="scope-line" id="scope-line" hidden><span id="scope-text"></span> <button type="button" class="linkbtn" id="scope-btn"></button></p>
      </div>
      <div class="filters" id="filters" aria-label="Filters"></div>
    </section>

    <section id="results" aria-label="Skills"></section>
  </main>
</div>

<!-- Preview -->
<dialog class="dlg" id="preview" aria-labelledby="pv-title">
  <div class="pv-head">
    <div class="badges"><span class="badge" id="pv-category"></span><span class="tag" id="pv-type"></span><span class="tag" id="pv-pkg" hidden>Skill package</span></div>
    <h2 id="pv-title"></h2>
    <p id="pv-desc"></p>
  </div>
  <div class="pv-body">
    <div class="md" id="pv-content" tabindex="0" aria-label="Skill instructions"></div>
    <div class="pv-files" id="pv-files" hidden></div>
  </div>
  <div class="pv-foot">
    <button type="button" class="btn btn-secondary" id="pv-copy">Copy Instructions</button>
    <button type="button" class="btn btn-primary" id="pv-download">Download .md</button>
    <button type="button" class="btn btn-secondary" id="pv-close">Close</button>
  </div>
</dialog>



<div class="status" id="status" role="status" aria-live="polite" hidden></div>

    originalType: "prompt",
    markdownContent: `# Job Description Writer

## What this does
Turns a few notes about a vacancy into a clear, welcoming job description that candidates can understand quickly.

## When to use it
Use it when opening a new role or refreshing an old advertisement for [Job Title] at [Company Name].

## What to provide
- Job title and department
- Main responsibilities (rough notes are fine)
- Must-have and nice-to-have skills
- Location, working pattern and salary range if you want them shown

## Instructions
1. Write a two-sentence summary of the role and why it matters to [Company Name].
2. List 5 to 7 key responsibilities, each starting with an action verb.
3. Separate **requirements** (must have) from **nice to have**. Keep requirements to what is truly needed for the job.
4. Use plain, inclusive language. Avoid jargon, slang and unnecessary degree or age requirements.
5. Close with a short paragraph about the team and how to apply.

## Output format
A job description with these headings: Role summary, What you will do, What you bring, Nice to have, About the team, How to apply.

## Check before sharing
- Salary, location and dates are correct.
- Requirements are realistic for the seniority of the role.
- HR or the hiring manager has approved the final text.
`

    description: "Build a consistent set of interview questions with a simple scoring guide.",
    originalType: "prompt",
    markdownContent: `# Interview Question Planner

## What this does
Creates a structured interview plan so every candidate for the same role is asked the same questions and scored the same way.

## When to use it
Use it before interviews for [Job Title] to keep the process fair and comparable.

## What to provide
- The job description or a list of key skills
- Interview length in minutes
- Any topics that must be covered

## Instructions
1. Choose 6 to 8 questions that match the key skills for the role.
2. Mix question types: past experience, a realistic work scenario, and motivation.
3. For each question, say what a strong, acceptable and weak answer looks like.
4. Add a 1 to 5 scoring scale and a space for short notes.
5. Suggest a time split so the interview finishes on schedule.

### Scoring scale
| Score | Meaning |
| --- | --- |
| 1 | Does not meet the need |
| 3 | Meets the need |
| 5 | Clearly exceeds the need |

## Output format
A table with columns: Question, What to listen for, Score (1-5), Notes. Followed by a suggested time plan.

## Check before sharing
- No question asks about protected personal characteristics (for example age, religion or family plans).
- Every question links to a real requirement of the role.
`

    title: "Budget Variance Analysis",
    category: "Finance",
    subDomain: "Budgeting & Forecasting",
    description: "Analyze actual-versus-budget figures and explain key business differences in simple language.",
    originalType: "prompt",
    markdownContent: `# Budget Variance Analysis

## What this does
Compares actual results with the budget, highlights the biggest differences and explains them in plain business language.

## When to use it
Use it for month-end or quarter-end reviews of [Department] or [Cost Centre] for [Period].

## What to provide
- A table of budget and actual amounts by line item
- The period covered and the currency
- Known one-off events (for example a price change or a delayed purchase)

## Instructions
1. Calculate variance for each line: Actual minus Budget, and as a percentage of Budget.
2. Mark each variance as favourable or unfavourable for profit.
3. Rank the five largest variances by amount.
4. For each of the five, give a likely business reason based on the information provided. If the reason is not in the data, say it needs confirming.
5. Finish with two or three suggested follow-up questions for the budget owner.

### Variance formula
\`\`\`
Variance        = Actual - Budget
Variance %      = (Actual - Budget) / Budget
\`\`\`

## Output format
A short summary paragraph, then a table with: Line item, Budget, Actual, Variance, Variance %, Favourable/Unfavourable, Comment.

## Check before sharing
- Totals add up to the source figures.
- Signs (+/-) follow your company's variance convention.
- Reasons marked 'needs confirming' are checked with the budget owner.
`

## Output format
A summary paragraph, a category totals table, and a separate list titled 'Items to review' with the reason for each.

## Check before sharing

## What to provide

3. Produce three cases: Best, Expected and Worst, each with its own assumptions.

## Check before sharing

- The first forecast period is compared with what actually happened, once it is known.
- Treat the result as an estimate, not a commitment.

  /* Save records: browser storage first, then memory, so what you see is what is stored. */
  async function saveRecords(records, onProgress) {
    var toStore = records.map(function (r) { r.contentHash = hashText(normForHash(r.markdownContent)); return r; });
    try {
      await dbPutMany(toStore, onProgress);
    } catch (e) {
      var n = e.savedCount || 0;
      toStore.slice(0, n).forEach(function (r) { storedMap.set(r.id, r); });
      derive();
      var err = new Error(storageMessage(e));
      err.savedCount = n;
      throw err;
    }
    toStore.forEach(function (r) { storedMap.set(r.id, r); });
    derive();
    return toStore.length;
  }
  async function deleteResources(ids) {
    var tomb = [], gone = [];
    ids.forEach(function (id) {
      var r = lib.byId.get(id);
      if (!r) return;
      if (r.source === 'sample' && sampleIds[id]) tomb.push({ id: id, source: 'sample', deleted: true });
      else gone.push(id);
    });
    try {
      if (gone.length) await dbDeleteMany(gone);
      if (tomb.length) await dbPutMany(tomb);
    } catch (e) { throw new Error(storageMessage(e)); }
    gone.forEach(function (id) { storedMap.delete(id); });
    tomb.forEach(function (t) { storedMap.set(t.id, t); });
    derive();
    return ids.length;
  }

  /* =====================================================================
     DOWNLOADS
     ===================================================================== */
  function contentOf(skill) {
    if (!skill || typeof skill.markdownContent !== 'string') return '';
    var text = skill.markdownContent.replace(/\r\n?/g, '\n');
    if (!text.trim()) return '';
    return text.endsWith('\n') ? text : text + '\n';
  }
  function safeSegment(s) { return String(s).replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '-').replace(/^\.+/, '').trim() || 'skill'; }
  function isPackage(r) { return !!(r && r.package && r.package.files); }
  /* Files of one resource, relative to its own folder (or a single .md file for standalone resources). */
  function packageFiles(r, prefix) {
    var root = prefix + safeSegment(r.package.rootName || slug(r.title)) + '/';
    var out = [{ name: root + (r.package.skillFile || 'SKILL.md'), content: contentOf(r) }];
    r.package.files.forEach(function (f) { out.push({ name: root + f.path, content: f.data }); });
    return out;
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function downloadSkill(skill) {
    try {
      var text = contentOf(skill);
      if (!text) { notify('Sorry, this skill has no instructions to download.', 'error'); return; }
      if (isPackage(skill)) {
        var zname = slug(skill.title) + '.zip';
        downloadBlob(buildZip(packageFiles(skill, '')), zname);
        notify('Downloaded ' + zname + ' (skill package with ' + plural(skill.package.files.length + 1, 'file') + ')');
        return;
      }
      var name = slug(skill.title) + '.md';
      downloadBlob(new Blob([text], { type: 'text/markdown;charset=utf-8' }), name);
      notify('Downloaded ' + name);
    } catch (err) {
      console.error(err);
      notify('Sorry, the download did not work. Please try again.', 'error');
    }
  }

  function downloadZip() {
    var category = state.category;
    var list = filterByChips(skillsIn(category));
    if (!list.length) {
      notify('There are no skills in ' + category + ' yet, so there is nothing to download.', 'error');
      return;
    }
    try {
      var used = {}, files = [], skipped = 0, count = 0;
      list.forEach(function (s) {
        var text = contentOf(s);
        if (!text) { skipped++; return; }
        var folder = category === ALL ? slug(s.category) + '/' : '';
        var base = isPackage(s) ? safeSegment(s.package.rootName || slug(s.title)) : slug(s.title), name = base, n = 2;
        var key = function (nm) { return (folder + nm).toLowerCase(); };
        while (used[key(name)]) { name = base + '-' + n; n++; }
        used[key(name)] = true;
        if (isPackage(s)) {
          var pkgFiles = packageFiles(s, folder);
          /* use the unique name as the folder name so packages never collide */
          var oldRoot = folder + safeSegment(s.package.rootName || slug(s.title)) + '/';
          var newRoot = folder + name + '/';
          pkgFiles.forEach(function (f) { files.push({ name: newRoot + f.name.slice(oldRoot.length), content: f.content }); });
        } else {
          files.push({ name: folder + name + '.md', content: text });
        }
        count++;
      });
      if (!files.length) {
        notify('None of the skills in ' + category + ' have instructions, so no ZIP was created.', 'error');
        return;
      }
      var zipName = zipNameFor(category, state.sub, state.type);
      downloadBlob(buildZip(files), zipName);
      notify('Downloaded ' + zipName + ' (' + plural(count, 'skill') + ')' +
        (skipped ? '. ' + skipped + ' without instructions skipped.' : ''));
    } catch (err) {
      console.error(err);
      notify('Sorry, the ZIP file could not be created. Please try again.', 'error');
    }
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function legacyCopy(text) {

      var ta = document.createElement('textarea');

      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }

  /* =====================================================================
     BROWSING UI (sidebar, cards, preview)
     ===================================================================== */
  /* Chips (sub-domain) and the Prompt/Skill switch narrow the current category. */
  function filterByChips(list) {
    return list.filter(function (r) { return (!state.type || r.originalType === state.type) && (!state.sub || r.subDomain === state.sub); });
  }
  function haystack(r) {
    var h = hayCache.get(r);
    if (!h) {
      h = [r.title, r.description, r.category, r.subDomain || '', typeLabel(r.originalType), r.markdownContent].join('\n').toLowerCase();
      hayCache.set(r, h);
    }
    return h;
  }
  function searchTerms() { return state.query.toLowerCase().split(/\s+/).filter(Boolean); }
  function isSearching() { return searchTerms().length > 0; }
  function searchPool() { return state.here && state.category !== ALL ? skillsIn(state.category) : libList(); }
  /* Search looks through the whole library (title, description, domain, sub-domain and instructions). Title matches rank first. */
  function visibleSkills() {
    var terms = searchTerms();
    if (!terms.length) return filterByChips(skillsIn(state.category));
    var scored = [];
    searchPool().forEach(function (r, i) {
      if (state.type && r.originalType !== state.type) return;
      var h = haystack(r), score = 0;
      for (var k = 0; k < terms.length; k++) {
        if (h.indexOf(terms[k]) === -1) return;
        score += r.title.toLowerCase().indexOf(terms[k]) !== -1 ? 4 : ((r.description + ' ' + (r.subDomain || '')).toLowerCase().indexOf(terms[k]) !== -1 ? 2 : 1);
      }
      scored.push({ r: r, s: score, i: i });
    });
    scored.sort(function (a, b) { return (b.s - a.s) || (a.i - b.i); });
    return scored.map(function (x) { return x.r; });
  }

  function renderFilters() {
    var box = $('filters');
    var searching = isSearching();
    var base = searching ? searchPool() : skillsIn(state.category);
    var subs = !searching && state.category !== ALL ? subDomainsOf(state.category) : [];
    if (state.sub && !subs.some(function (x) { return x.name === state.sub; })) state.sub = '';
    var typed = searching ? base : base.filter(function (r) { return !state.sub || r.subDomain === state.sub; });
    var c = { prompt: 0, skill: 0 };
    typed.forEach(function (r) { c[r.originalType === 'skill' ? 'skill' : 'prompt']++; });
    var t = state.type;
    var html = '<div class="seg" role="group" aria-label="Show prompts or skills">' +
      '<button type="button" data-type="" aria-pressed="' + (t === '') + '">All types</button>' +
      '<button type="button" data-type="prompt" aria-pressed="' + (t === 'prompt') + '">Prompts (' + c.prompt + ')</button>' +
      '<button type="button" data-type="skill" aria-pressed="' + (t === 'skill') + '">Skills (' + c.skill + ')</button></div>';
    if (subs.length) {
      var total = base.length;
      html += '<div class="chips" role="group" aria-label="Sub-domain"><span class="chips-label">Sub-domain</span>' +
        '<button type="button" class="chip" data-sub="" aria-pressed="' + (state.sub === '') + '">All<span class="n">' + total + '</span></button>' +
        subs.map(function (x) { return '<button type="button" class="chip" data-sub="' + esc(x.name) + '" aria-pressed="' + (state.sub === x.name) + '">' + esc(x.name) + '<span class="n">' + x.count + '</span></button>'; }).join('') + '</div>';
    }

  function renderCategories() {
    var counts = {};
    libList().forEach(function (s) { counts[s.category] = (counts[s.category] || 0) + 1; });
    var items = [{ name: ALL, count: libList().length }].concat(
      allCategories().map(function (c) { return { name: c, count: counts[c] || 0 }; })
    );
    if (counts[UNCAT] || state.category === UNCAT) items.push({ name: UNCAT, count: counts[UNCAT] || 0 });
    $('categories').innerHTML = '<ul>' + items.map(function (it) {
      return '<li><button type="button" class="cat" data-category="' + esc(it.name) + '">' +
        '<span>' + esc(it.name) + '</span>' +

        '</button></li>';

  }
  function markActiveCategory() {
    var buttons = $('categories').querySelectorAll('.cat');
    Array.prototype.forEach.call(buttons, function (b) {
      var active = b.getAttribute('data-category') === state.category;

  }

  function renderList() {
    if (state.category !== ALL && state.category !== UNCAT && allCategories().indexOf(state.category) < 0) state.category = ALL;
    var searching = isSearching();
    renderFilters();
    var inCategory = skillsIn(state.category);
    var chipBase = filterByChips(inCategory);
    var shown = visibleSkills();
    var scoped = state.here && state.category !== ALL;
    $('list-title').textContent = searching ? (scoped ? state.category + ': search results' : 'Search results') : (state.category + (state.sub ? ' \u203a ' + state.sub : ''));
    $('search').setAttribute('placeholder', 'Search skills and instructions');

    var count;
    if (searching) count = plural(shown.length, 'result') + ' for \u201c' + state.query.trim() + '\u201d';
    else if (state.sub || state.type) count = shown.length + ' of ' + plural(inCategory.length, 'skill') + ' shown';
    else count = plural(inCategory.length, 'skill');
    $('list-count').textContent = count;

    var line = $('scope-line');
    if (searching && state.category !== ALL) {
      line.hidden = false;
      $('scope-text').textContent = scoped ? 'Only searching in ' + state.category + '.' : 'Searching the whole library.';
      $('scope-btn').textContent = scoped ? 'Search everything' : 'Only in ' + state.category;
    } else line.hidden = true;

    var zip = $('zip-btn');
    zip.setAttribute('aria-label', 'Download All as ZIP: ' + state.category + (state.sub ? ' ' + state.sub : '') + ', ' + plural(chipBase.length, 'skill'));
    zip.setAttribute('aria-disabled', chipBase.length ? 'false' : 'true');

    var results = $('results');
    if (!inCategory.length && !searching) {
      results.innerHTML = '<div class="empty"><strong>No skills in ' + esc(state.category) + ' yet</strong>' + (IS_ADMIN ? 'Use + Add Resource to add the first one, or choose another category.' : 'Choose another category, or ask your administrator to add some.') + '</div>';
      return;
    }
    if (!shown.length) {
      results.innerHTML = '<div class="empty"><strong>' + (searching ? 'No skills match your search' : 'Nothing matches these filters') + '</strong>' +
        (searching ? 'Try a different word, or clear the search box.' : 'Try "All types" or "All" sub-domains.') + '</div>';
      return;
    }
    results.innerHTML = '<div class="grid">' + shown.map(function (s) {
      var id = esc(s.id), title = esc(s.title), pkg = isPackage(s);
      return '<article class="card">' +
        '<h3>' + title + '</h3>' +
        '<p>' + (s.description ? esc(s.description) : '<em>No description yet.</em>') + '</p>' +
        '<div class="badges"><span class="badge">' + esc(s.category) + '</span>' + (s.subDomain ? '<span class="tag sub">' + esc(s.subDomain) + '</span>' : '') + '<span class="tag">' + typeLabel(s.originalType) + '</span>' +
        (pkg ? '<span class="tag">Package &middot; ' + plural(s.package.files.length + 1, 'file') + '</span>' : '') + '</div>' +
        '<div class="actions">' +
        '<button type="button" class="btn btn-secondary" data-action="preview" data-id="' + id + '" aria-label="Preview ' + title + '">Preview</button>' +
        '<button type="button" class="btn btn-primary" data-action="download" data-id="' + id + '" aria-label="Download ' + (pkg ? '.zip' : '.md') + ' for ' + title + '">' + (pkg ? 'Download .zip' : 'Download .md') + '</button>' +
        '</div></article>';
    }).join('') + '</div>';
  }

  function refreshAll() {
    renderCategories();
    renderList();
  }

  /* ---------- Preview dialog ---------- */
  function openPreviewFor(view, ref) {
    state.previewRef = ref;
    $('pv-title').textContent = view.title;
    $('pv-category').textContent = view.category + (view.subDomain ? ' \u203a ' + view.subDomain : '');
    $('pv-type').textContent = typeLabel(view.originalType);
    $('pv-desc').textContent = view.description || '';
    $('pv-desc').hidden = !view.description;
    var text = contentOf(view);
    $('pv-content').innerHTML = text ? renderResourceMarkdown(text) : '<p>This resource has no instructions yet.</p>';
    var pkg = isPackage(view);
    $('pv-pkg').hidden = !pkg;
    var fl = $('pv-files');
    if (pkg) {
      fl.hidden = false;
      fl.innerHTML = '<h3>Package files (' + (view.package.files.length + 1) + ')</h3><ul><li>' + esc((view.package.rootName || '') + '/' + (view.package.skillFile || 'SKILL.md')) + '</li>' +
        view.package.files.slice(0, 200).map(function (f) { return '<li>' + esc((view.package.rootName || '') + '/' + f.path) + ' <small>(' + fmtSize(f.data.length) + ')</small></li>'; }).join('') +
        (view.package.files.length > 200 ? '<li>&hellip; and ' + (view.package.files.length - 200) + ' more</li>' : '') + '</ul>';
    } else { fl.hidden = true; fl.innerHTML = ''; }
    $('pv-copy').textContent = 'Copy Instructions';
    $('pv-download').textContent = pkg ? 'Download .zip' : 'Download .md';
    $('pv-download').hidden = ref.kind !== 'library';

    dlg.querySelector('.pv-body').scrollTop = 0;

  }
  function openPreview(id) {
    var skill = skillById(id);
    if (skill) openPreviewFor(skill, { kind: 'library', id: id });
  }
  function currentPreviewResource() {
    var ref = state.previewRef;
    if (!ref) return null;
    return ref.kind === 'library' ? skillById(ref.id) : ref.view;
  }
  function closePreview() { closeDialog($('preview')); }

  /* =====================================================================
     DOMAIN SUGGESTION (for imports)
     ===================================================================== */
  var ALIASES = { humanresources: 'HR', pbi: 'Power BI', pm: 'Project Management', ops: 'Operations' };
  function matchDomain(text) {
    var k = catKey(text);
    if (!k) return null;
    var cats = allCategories();
    for (var i = 0; i < cats.length; i++) if (catKey(cats[i]) === k) return cats[i];
    if (ALIASES[k]) { var a = ALIASES[k]; for (var j = 0; j < cats.length; j++) if (cats[j] === a) return a; }
    return null;
  }
  /* Sub-domain: the folder right after the matching domain folder (HR/Recruitment/x.md -> Recruitment). Never guesses. */
  function subFromFolders(folders, domain) {
    if (!domain || domain === UNCAT) return '';
    for (var i = 0; i < folders.length; i++) {
      if (matchDomain(folders[i]) === domain) {
        var next = folders[i + 1];
        if (next && !matchDomain(next)) return cleanSub(humanize(next));
        return '';
      }
    }
    return '';
  }
  /* Returns { category, note } using metadata, folder names, then filename prefix. Never guesses. */
  function suggestDomain(meta, folders, filename) {
    var mc = meta.category || meta.domain || meta.department;
    if (mc) {
      var m1 = matchDomain(mc);
      if (m1) return { category: m1, note: 'Domain from file metadata' };
      return { category: UNCAT, note: 'Metadata names "' + String(mc).slice(0, 40) + '", which is not a known domain' };
    }
    var found = [], seen = {};
    folders.forEach(function (f) { var d = matchDomain(f); if (d && !seen[d]) { seen[d] = true; found.push(d); } });
    if (found.length === 1) return { category: found[0], note: 'Suggested from folder name' };
    if (found.length > 1) return { category: UNCAT, note: 'Folder names match more than one domain (' + found.join(', ') + ')' };
    var tokens = String(filename).replace(/\.[A-Za-z0-9]+$/, '').split(/[-_ .]+/).filter(Boolean);
    var two = tokens.length > 1 ? matchDomain(tokens[0] + tokens[1]) : null;
    var one = tokens.length ? matchDomain(tokens[0]) : null;
    if (two || one) return { category: two || one, note: 'Suggested from filename' };
    var unknown = folders.filter(function (f) { return f && f.length <= 40; }).pop();
    return { category: UNCAT, note: unknown ? 'Folder "' + unknown + '" is not a known domain' : 'No folder, filename or metadata hint' };
  }

  /* =====================================================================
     IMPORT: turn files into reviewable items
     ===================================================================== */
  var imp = null;

  function invalidItem(filename, reason) {
    return { key: 'i' + (imp ? ++imp.seq : Math.random()), filename: filename, status: 'invalid', reason: reason, selected: false,
      title: '', type: 'prompt', category: UNCAT, sub: '', description: '', markdownContent: '', package: null, dup: null, dupAction: 'skip', catNote: '' };
  }

  function buildItem(o, setup) {
    var fm = parseFrontmatter(o.text);
    var body = fm.body;
    var meta = fm.meta;
    var heading = firstHeading(body);
    var fallbackName = o.pkg ? o.pkg.rootName : o.filename;
    var title = meta.title || heading || meta.name || humanize(fallbackName);
    var description = meta.description ? meta.description.replace(/\s+/g, ' ').trim().slice(0, 300) : firstParagraph(body);
    var type = meta.type && /^(prompt|skill)$/i.test(meta.type) ? meta.type.toLowerCase() : (o.pkg || /^skill\.md$/i.test(o.filename) ? 'skill' : setup.defType);
    var cat, note;
    if (setup.mode === 'single') { cat = setup.domain; note = 'Domain chosen for this import'; }
    else { var s = suggestDomain(meta, o.folders || [], o.filename); cat = s.category; note = s.note; }
    var sub = cleanSub(meta.subdomain || meta['sub-domain'] || meta.sub_domain || meta.subcategory || '');
    if (!sub) sub = subFromFolders(o.folders || [], cat);
    if (!sub && setup.mode === 'single' && setup.sub) sub = cleanSub(setup.sub);
    return {
      key: 'i' + (++imp.seq), filename: o.display || o.filename, status: 'ok', reason: '', selected: true,
      title: String(title).slice(0, 150), type: type, category: cat, sub: sub, catNote: note, description: description,
      markdownContent: o.text, package: o.pkg || null, presetId: meta.id && /^[\w.:-]{1,120}$/.test(meta.id) ? meta.id : '',
      idForMatching: meta.id || '', dup: null, dupAction: 'skip', titleFallback: !(meta.title || heading)
    };
  }

  /* Group extracted/loose files into skill packages (folders containing SKILL.md) and standalone prompts. */
  function itemsFromEntries(entries, archiveBase, setup, notes) {
    var items = [], clean = [];
    entries.forEach(function (e) { clean.push({ path: e.path, data: e.data }); });
    var roots = [];
    clean.forEach(function (e) {
      if (baseName(e.path).toLowerCase() === 'skill.md') {
        var d = dirOf(e.path);
        if (roots.indexOf(d) < 0) roots.push(d);
      }
    });
    roots.sort(function (a, b) { return b.length - a.length; });
    var pkgs = {}, loose = [];
    roots.forEach(function (r) { pkgs[r] = { root: r, skill: null, files: [] }; });
    clean.forEach(function (e) {
      for (var i = 0; i < roots.length; i++) {
        var r = roots[i];
        if (r === '' || e.path.indexOf(r) === 0) {
          var rel = e.path.slice(r.length);
          if (rel.toLowerCase() === 'skill.md') { if (!pkgs[r].skill) pkgs[r].skill = e; else pkgs[r].files.push({ path: rel, data: e.data }); }
          else pkgs[r].files.push({ path: rel, data: e.data });
          return;
        }
      }
      loose.push(e);
    });
    roots.forEach(function (r) {
      var p = pkgs[r];
      var dec = decodeUtf8(p.skill.data);
      var rootName = r ? r.replace(/\/$/, '').split('/').pop() : (archiveBase || 'skill');
      var parents = r ? r.replace(/\/$/, '').split('/').slice(0, -1) : [];
      if (archiveBase) parents.unshift(archiveBase);
      if (dec.error || !dec.text.trim()) {
        items.push(invalidItem((r || '') + p.skill.path.split('/').pop(), dec.error || 'SKILL.md is empty'));
        return;
      }
      var it = buildItem({
        text: dec.text, filename: 'SKILL.md', display: rootName + '/SKILL.md', folders: parents,
        pkg: { rootName: rootName, skillFile: baseName(p.skill.path), files: p.files }
      }, setup);
      it.fileCount = p.files.length + 1;
      items.push(it);
    });
    var skippedOther = 0;
    loose.forEach(function (e) {
      var ext = extOf(e.path);
      if (ext !== 'md' && ext !== 'markdown' && ext !== 'txt') { skippedOther++; return; }
      if (e.data.length > LIMITS.textFile) { items.push(invalidItem(baseName(e.path), 'File is larger than ' + fmtSize(LIMITS.textFile))); return; }
      var dec = decodeUtf8(e.data);
      if (dec.error) { items.push(invalidItem(baseName(e.path), dec.error)); return; }
      if (!dec.text.trim()) { items.push(invalidItem(baseName(e.path), 'The file is empty')); return; }
      var folders = dirOf(e.path).split('/').filter(Boolean);
      if (archiveBase) folders.unshift(archiveBase);
      items.push(buildItem({ text: dec.text, filename: baseName(e.path), display: e.path, folders: folders }, setup));
    });
    if (skippedOther) notes.push(plural(skippedOther, 'file') + ' that are not .md, .txt or part of a SKILL.md package ' + (skippedOther === 1 ? 'was' : 'were') + ' skipped.');
    return items;
  }

  function validateBackupResource(r, idx) {
    if (!r || typeof r !== 'object') return 'Entry ' + (idx + 1) + ' is not an object';
    if (typeof r.id !== 'string' || !/^[\w.:-]{1,200}$/.test(r.id)) return 'Entry ' + (idx + 1) + ' has an invalid id';
    if (typeof r.title !== 'string' || !r.title.trim()) return 'Entry ' + (idx + 1) + ' has no title';
    if (typeof r.markdownContent !== 'string' || !r.markdownContent.trim()) return '"' + r.title.slice(0, 40) + '" has no instructions';
    if (r.category != null && typeof r.category !== 'string') return '"' + r.title.slice(0, 40) + '" has an invalid category';

  async function analyzeInputs(inputs, setup, onProgress) {
    var items = [], notes = [], looseEntries = [], totalBytes = 0;
    for (var n = 0; n < inputs.length; n++) {
      if (imp.cancelled) break;
      var inp = inputs[n], file = inp.file, name = file.name, path = inp.path || name, ext = extOf(name);
      onProgress(n, inputs.length, path);
      try {
        if (path.indexOf('/') >= 0) {                       /* from a picked or dropped folder */
          if (file.size > LIMITS.entry) { items.push(invalidItem(path, 'File is larger than ' + fmtSize(LIMITS.entry))); }
          else {

            if (!/^\.|\/\./.test(path) && !isJunkPath(path)) looseEntries.push({ path: path, data: new Uint8Array(await readFileBuffer(file)) });
          }

          if (file.size > LIMITS.zipFile) throw new ImportError('The ZIP file is larger than ' + fmtSize(LIMITS.zipFile) + '.');
          var z = await readZip(await readFileBuffer(file));
          z.problems.forEach(function (pr) { notes.push(name + ': ' + pr); });
          var zi = itemsFromEntries(z.entries, name.replace(/\.zip$/i, ''), setup, notes);
          if (!zi.length) notes.push(name + ': no .md or .txt files were found.');
          items = items.concat(zi);
        } else if (ext === 'json') {
          if (file.size > LIMITS.jsonFile) throw new ImportError('The JSON file is larger than ' + fmtSize(LIMITS.jsonFile) + '.');
          var dj = decodeUtf8(new Uint8Array(await readFileBuffer(file)));

          var bk = parseBackup(dj.text);

        } else if (ext === 'md' || ext === 'markdown' || ext === 'txt') {

  }

  function readEntry(entry, base) {

  async function startImport(inputs, presetItems) {
    if (!inputs.length) { notify('No files were selected.', 'error'); return; }
    var setup = imp && !presetItems ? readSetup() : { mode: 'detect', domain: '', defType: 'prompt' };
    if (!imp) imp = { items: [], notes: [], page: 0, cancelled: false, seq: 0, backupCategories: [] };
    imp.mode = setup.mode; imp.domain = setup.domain; imp.defType = setup.defType; imp.cancelled = false;
    setAdd('Reading files',
      '<div class="progress-wrap"><p id="prog-text" aria-live="polite">Starting&hellip;</p><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="prog"><div class="bar" id="prog-bar"></div></div></div>',
      '<button type="button" class="btn btn-secondary" data-act="cancel-read">Cancel</button>');
    var res;
    try {
      res = await analyzeInputs(inputs, setup, function (done, total, path) {
        var pct = total ? Math.round(done / total * 100) : 100;
        var bar = $('prog-bar');
        if (!bar) return;
        bar.style.width = pct + '%';
        $('prog').setAttribute('aria-valuenow', String(pct));
        $('prog-text').textContent = done >= total ? 'Finishing up…' : 'Reading ' + (done + 1) + ' of ' + total + (path ? ': ' + path : '');
      });
    } catch (e) {
      notify('Import failed: ' + e.message, 'error');
      showImportSetup();
      return;
    }
    if (imp.cancelled) { showImportSetup(); return; }
    imp.items = res.items; imp.notes = res.notes;
    if (!imp.items.length) { notify(res.notes.length ? res.notes.slice(0, 2).join(' ') : 'Nothing could be read from those files.', 'error'); showImportSetup(); return; }
    markDuplicates(imp.items);
    imp.page = 0;
    showImportPreview();
  }

  function importCategoryList() {

    imp.items.forEach(function (it) { if (it.category && it.category !== UNCAT && !cats.some(function (x) { return catKey(x) === catKey(it.category); })) cats.push(it.category); });

      '<span class="grp"><label class="t" for="bulk-type">Type for selected</label><select id="bulk-type"><option value="prompt">Prompt</option><option value="skill">Skill</option></select><button type="button" class="btn btn-secondary btn-sm" data-act="apply-type">Apply</button></span>' +
      '<span class="grp" id="dup-tools"><label class="t" for="bulk-dup">All duplicates</label><select id="bulk-dup"><option value="skip">Skip Duplicate</option><option value="keep">Keep Both</option><option value="replace">Replace Existing</option></select><button type="button" class="btn btn-secondary btn-sm" data-act="apply-dup">Apply to all duplicates</button></span></div>' +
      '<div class="tbl-wrap"><table class="tbl"><caption class="visually-hidden">Files to import</caption><thead><tr><th scope="col"><span class="visually-hidden">Select</span></th><th scope="col">Filename</th><th scope="col">Title</th><th scope="col">Type</th><th scope="col">Domain</th><th scope="col">Sub-domain</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Preview</span></th></tr></thead><tbody id="imp-rows"></tbody></table></div>' + subDatalistHtml('imp-sublist', '') +
      '<div class="pager" id="imp-pager"></div>', foot);

    updateImportSummary();
  }
  function renderImportRows() {
    var start = imp.page * PAGE_SIZE, rows = imp.items.slice(start, start + PAGE_SIZE);
    $('imp-rows').innerHTML = rows.map(rowHtml).join('');
    var pages = Math.max(1, Math.ceil(imp.items.length / PAGE_SIZE));
    $('imp-pager').innerHTML = '<span class="count-note">Showing ' + (imp.items.length ? start + 1 : 0) + '&ndash;' + Math.min(imp.items.length, start + PAGE_SIZE) + ' of ' + imp.items.length + '</span>' +
      (pages > 1 ? '<button type="button" class="btn btn-secondary btn-sm" data-act="page-prev"' + (imp.page === 0 ? ' disabled' : '') + '>Previous</button><span>Page ' + (imp.page + 1) + ' of ' + pages + '</span><button type="button" class="btn btn-secondary btn-sm" data-act="page-next"' + (imp.page >= pages - 1 ? ' disabled' : '') + '>Next</button>' : '');
  }
  function updateImportSummary() {
    var it = imp.items, valid = it.filter(function (x) { return x.status === 'ok'; });
    var dups = valid.filter(function (x) { return x.dup; }).length, unc = valid.filter(function (x) { return x.category === UNCAT; }).length;
    var bad = it.length - valid.length, go = it.filter(isImportable).length;
    $('imp-summary').innerHTML = '<span class="pill">' + plural(it.length, 'item') + ' found</span>' +
      '<span class="pill ok">' + (valid.length - dups) + ' new</span>' +
      (dups ? '<span class="pill warn">' + plural(dups, 'duplicate') + '</span>' : '') +
      (unc ? '<span class="pill warn">' + unc + ' need a domain</span>' : '') +
      (bad ? '<span class="pill bad">' + bad + ' skipped</span>' : '');
    var btn = $('import-btn');
    btn.textContent = 'Import Selected (' + go + ')';
    btn.disabled = !go;
    $('dup-tools').hidden = !dups;
  }
  function refreshRow(key) {
    var tr = $('imp-rows').querySelector('tr[data-key="' + key + '"]');
    var it = imp.items.filter(function (x) { return x.key === key; })[0];
    if (tr && it) tr.querySelector('.st-cell').innerHTML = statusHtml(it);
  }
  function selectedItems() { return imp.items.filter(function (x) { return x.status === 'ok' && x.selected; }); }

  async function resolveDomainChoice(value) {
    if (value !== '__new__') return value;
    var name = await askDomainName();
    if (!name) return null;
    if (importCategoryList().indexOf(name) < 0 && catKey(name) !== catKey(UNCAT)) imp.backupCategories.push(name);
    return name;
  }

  async function onImportChange(e) {
    var tr = e.target.closest('tr[data-key]');
    var cls = e.target.classList;
    if (!tr) return;
    var key = tr.getAttribute('data-key');
    var it = imp.items.filter(function (x) { return x.key === key; })[0];
    if (!it) return;
    if (cls.contains('row-sel')) { it.selected = e.target.checked; }
    else if (cls.contains('row-type')) { it.type = e.target.value; }
    else if (cls.contains('row-dup')) { it.dupAction = e.target.value; }
    else if (cls.contains('row-cat')) {
      var v = await resolveDomainChoice(e.target.value);
      if (v === null) { e.target.value = it.category; return; }
      it.category = v; it.catNote = 'Changed by you';
      renderImportRows(); updateImportSummary(); return;
    }
    refreshRow(key);
    updateImportSummary();
  }
  function onImportInput(e) {
    if (e.target.classList.contains('row-sub')) {
      var key0 = e.target.closest('tr[data-key]').getAttribute('data-key');
      var it0 = imp.items.filter(function (x) { return x.key === key0; })[0];
      if (it0) it0.sub = e.target.value;
      return;
    }
    if (!e.target.classList.contains('row-title')) return;
    var tr = e.target.closest('tr[data-key]'), key = tr.getAttribute('data-key');
    var it = imp.items.filter(function (x) { return x.key === key; })[0];
    if (!it) return;
    it.title = e.target.value;
    clearTimeout(imp.dupTimer);
    imp.dupTimer = setTimeout(function () {
      markDuplicates(imp.items);
      renderImportRows(); updateImportSummary();
    }, 600);
  }

  async function commitImport() {
    var go = imp.items.filter(isImportable);
    if (!go.length) { notify('Nothing is selected to import.', 'error'); return; }
    var missingTitle = go.filter(function (x) { return !x.title.trim(); });
    if (missingTitle.length) { notify(plural(missingTitle.length, 'selected item') + ' ' + (missingTitle.length === 1 ? 'has' : 'have') + ' no title. Please add titles before importing.', 'error'); return; }
    var replaces = go.filter(function (x) { return x.dup && x.dupAction === 'replace' && x.dup.existingId; });
    if (replaces.length) {
      var c = await confirmDanger('Replace existing resources?', plural(replaces.length, 'existing resource') + ' will be overwritten with the imported content. This cannot be undone (export a backup first if unsure).', 'Replace ' + replaces.length);
      if (!c) return;
    }
    var usedIds = {}, records = [], now = Date.now();
    var newCats = [];
    go.forEach(function (it) {
      var ex = it.dup && it.dupAction === 'replace' && it.dup.existingId ? skillById(it.dup.existingId) : null;
      var id;
      if (ex) id = ex.id;
      else if (it.presetId && !lib.byId.has(it.presetId) && !usedIds[it.presetId]) id = it.presetId;
      else id = newId();
      usedIds[id] = true;
      if (it.category !== UNCAT && importCategoryList().indexOf(it.category) >= 0 && allCategories().indexOf(it.category) < 0) newCats.push(it.category);
      records.push({
        id: id, title: it.title.trim(), category: it.category, subDomain: canonSub(it.category, it.sub) || (ex && !cleanSub(it.sub) ? ex.subDomain || '' : ''),
        description: it.description || '', markdownContent: it.markdownContent,
        originalType: it.type, source: ex ? ex.source : 'user', filename: it.filename, createdAt: ex ? (ex.createdAt || now) : (it.createdAt || now), updatedAt: now,
        contentHash: '', package: it.package
      });
    });
    var skipped = imp.items.filter(function (x) { return x.status === 'ok' && !isImportable(x) }).length;
    setAdd('Saving', '<div class="progress-wrap"><p id="prog-text" aria-live="polite">Saving 0 of ' + records.length + '&hellip;</p><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="prog"><div class="bar" id="prog-bar"></div></div></div>', '');
    var saved = 0, failMsg = '';
    try {
      await addCategories(newCats);
      saved = await saveRecords(records, function (done, total) {
        var pct = Math.round(done / total * 100);
        $('prog-bar').style.width = pct + '%'; $('prog').setAttribute('aria-valuenow', String(pct));
        $('prog-text').textContent = 'Saving ' + done + ' of ' + total + '…';
      });
    } catch (e) { failMsg = e.message; saved = e.savedCount || 0; }
    refreshAll();
    var replaced = replaces.length && !failMsg ? replaces.length : 0;
    setAdd(failMsg ? 'Import stopped' : 'Import complete',
      '<div class="done-box"><h3>' + (failMsg ? 'Saved ' + saved + ' of ' + records.length + '. ' : '') + (failMsg ? '' : plural(saved, 'resource') + ' imported') + '</h3>' +
      '<p>' + (failMsg ? esc(failMsg) : (replaced ? plural(replaced, 'existing resource') + ' replaced. ' : '') + (skipped ? plural(skipped, 'item') + ' skipped or left out. ' : '') + 'They now appear in the library and in category downloads.') + '</p></div>',
      '<span class="spacer"></span><button type="button" class="btn btn-primary" data-act="cancel">Done</button>');
    if (!failMsg) notify('Imported ' + plural(saved, 'resource') + '.');
    else notify(failMsg, 'error');
  }

  /* ----- Add dialog events ----- */
  async function onAddClick(e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    switch (act) {
      case 'cancel': closeAdd(); break;
      case 'back': showAddChoose(); break;
      case 'choose-manual': showAddManual(); break;
      case 'choose-import': showImportSetup(); break;
      case 'save-manual': await saveManual(); break;
      case 'pick-files': $('file-input').click(); break;
      case 'pick-folder': $('folder-input').click(); break;
      case 'cancel-read': if (imp) imp.cancelled = true; break;
      case 'sel-all': imp.items.forEach(function (x) { if (x.status === 'ok') x.selected = true; }); renderImportRows(); updateImportSummary(); break;
      case 'sel-none': imp.items.forEach(function (x) { x.selected = false; }); renderImportRows(); updateImportSummary(); break;
      case 'apply-cat': {
        var sel = selectedItems();
        if (!sel.length) { notify('Select some rows first.', 'error'); break; }
        var v = await resolveDomainChoice($('bulk-cat').value);
        if (v === null) break;
        sel.forEach(function (x) { x.category = v; x.catNote = 'Changed by you'; });
        showImportPreviewKeepPage();
        notify('Domain "' + v + '" applied to ' + plural(sel.length, 'resource') + '.');
        break;
      }
      case 'mark-uncat': {
        var s2 = selectedItems();
        if (!s2.length) { notify('Select some rows first.', 'error'); break; }
        s2.forEach(function (x) { x.category = UNCAT; x.catNote = 'Marked for later review'; });
        renderImportRows(); updateImportSummary();
        break;
      }
      case 'apply-sub': {
        var s4 = selectedItems();
        if (!s4.length) { notify('Select some rows first.', 'error'); break; }
        var sv = cleanSub($('bulk-sub').value);
        s4.forEach(function (x) { x.sub = sv; });
        renderImportRows(); updateImportSummary();
        notify(sv ? 'Sub-domain "' + sv + '" applied to ' + plural(s4.length, 'resource') + '.' : 'Sub-domain cleared for ' + plural(s4.length, 'resource') + '.');
        break;
      }
      case 'apply-type': {
        var s3 = selectedItems();
        if (!s3.length) { notify('Select some rows first.', 'error'); break; }
        s3.forEach(function (x) { x.type = $('bulk-type').value; });
        renderImportRows(); updateImportSummary();
        break;
      }
      case 'apply-dup': {
        var act2 = $('bulk-dup').value;
        imp.items.forEach(function (x) { if (x.dup) x.dupAction = (x.dup.inBatch && act2 === 'replace') ? 'skip' : act2; });
        renderImportRows(); updateImportSummary();
        break;
      }
      case 'page-prev': imp.page = Math.max(0, imp.page - 1); renderImportRows(); break;
      case 'page-next': imp.page += 1; renderImportRows(); break;
      case 'row-preview': {
        var key = b.closest('tr').getAttribute('data-key');
        var it = imp.items.filter(function (x) { return x.key === key; })[0];
        if (it) openPreviewFor({ title: it.title || it.filename, category: it.category, originalType: it.type, description: it.description, markdownContent: it.markdownContent, package: it.package }, { kind: 'import', view: it });
        break;
      }
      case 'import-selected': await commitImport(); break;
      default: break;
    }
  }
  function showImportPreviewKeepPage() {
    var pg = imp.page;

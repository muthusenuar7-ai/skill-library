      '<div class="pager" id="mg-pager"></div>';
    $('manage-foot').innerHTML = '<button type="button" class="btn btn-secondary" data-act="mg-export">Export Library</button><button type="button" class="btn btn-secondary" data-act="mg-import">Import Library Backup</button>' +
      (USER_EDITION_HTML ? '<button type="button" class="btn btn-dark" data-act="mg-publish" title="Creates the User edition file with this library inside">Publish for Users</button>' : '') +
      '<span id="mg-restore-wrap"></span><span class="spacer"></span><button type="button" class="btn btn-primary" data-act="mg-close">Close</button>';
    refreshManageControls();
    openDialog($('manage-dialog'));
    renderManageTable();
  }
  function refreshManageControls() {
    var cats = allCategories();
    $('mg-domain').innerHTML = '<option value="">All domains</option>' + cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('') + '<option value="' + UNCAT + '">' + UNCAT + '</option>';
    $('mg-domain').value = mg.domain;
    $('mg-move').innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('') + '<option value="' + UNCAT + '">' + UNCAT + '</option><option value="__new__">+ Add new domain&hellip;</option>';
    $('mg-sublist-wrap').innerHTML = subDatalistHtml('mg-sublist', '');
    var ds = deletedSamples().length;
    $('mg-restore-wrap').innerHTML = ds ? '<button type="button" class="btn btn-secondary" data-act="mg-restore">Restore ' + plural(ds, 'deleted sample') + '</button>' : '';
  }
  function manageFiltered() {
    var q = mg.q.trim().toLowerCase();
    return libList().filter(function (r) {
      if (mg.domain && r.category !== mg.domain) return false;
      if (mg.source && (r.source === 'sample' ? 'sample' : 'user') !== mg.source) return false;
      if (!q) return true;
      return (r.title + ' ' + r.description + ' ' + r.category + ' ' + (r.subDomain || '')).toLowerCase().indexOf(q) !== -1;
    });
  }
  function renderManageTable() {
    if (!mg) return;
    var list = manageFiltered();
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (mg.page >= pages) mg.page = pages - 1;
    var start = mg.page * PAGE_SIZE, rows = list.slice(start, start + PAGE_SIZE);
    $('mg-rows').innerHTML = rows.length ? rows.map(function (r) {
      var sample = r.source === 'sample';
      return '<tr data-id="' + esc(r.id) + '"><td><input type="checkbox" class="mg-sel" aria-label="Select ' + esc(r.title) + '"' + (mg.sel.has(r.id) ? ' checked' : '') + '></td>' +
        '<td>' + esc(r.title) + (isPackage(r) ? '<span class="hint">Skill package &middot; ' + plural(r.package.files.length + 1, 'file') + '</span>' : '') + '</td><td>' + esc(r.category) + '</td><td>' + esc(r.subDomain || '') + '</td><td>' + typeLabel(r.originalType) + '</td>' +
        '<td>' + (sample ? '<span class="tag">Built-in sample</span>' : '<span class="tag">Added</span>') + '</td>' +
        '<td><button type="button" class="btn btn-secondary btn-sm" data-act="mg-edit" aria-label="Edit ' + esc(r.title) + '">Edit</button> ' +
        '<button type="button" class="btn btn-secondary btn-sm" data-act="mg-delete" aria-label="Delete ' + esc(r.title) + '">Delete</button></td></tr>';
    }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px">No resources match.</td></tr>';
    $('mg-pager').innerHTML = '<span class="count-note">' + plural(list.length, 'resource') + (list.length ? ' &middot; showing ' + (start + 1) + '&ndash;' + Math.min(list.length, start + PAGE_SIZE) : '') + '</span>' +
      (pages > 1 ? '<button type="button" class="btn btn-secondary btn-sm" data-act="mg-prev"' + (mg.page === 0 ? ' disabled' : '') + '>Previous</button><span>Page ' + (mg.page + 1) + ' of ' + pages + '</span><button type="button" class="btn btn-secondary btn-sm" data-act="mg-next"' + (mg.page >= pages - 1 ? ' disabled' : '') + '>Next</button>' : '');
    $('mg-selcount').textContent = mg.sel.size + ' selected';
  }

  async function deleteWithConfirm(ids) {
    var existing = ids.filter(function (id) { return lib.byId.has(id); });
    if (!existing.length) return;
    var samples = existing.filter(function (id) { return lib.byId.get(id).source === 'sample'; });
    var others = existing.length - samples.length;
    var msg = 'Delete ' + plural(existing.length, 'resource') + '? This cannot be undone. Export a backup first if you might need them.';
    var ok;
    if (samples.length) {
      msg = 'You selected ' + plural(samples.length, 'built-in sample resource') + (others ? ' and ' + plural(others, 'added resource') : '') + '. The samples are protected: they are only deleted if you tick the box below. (You can restore deleted samples later from Manage Resources.)';
      ok = await confirmDanger('Delete resources?', msg, 'Delete', 'Also delete the ' + plural(samples.length, 'built-in sample') + ' in this selection');
      if (!ok) return;
      if (!ok.checked) existing = existing.filter(function (id) { return samples.indexOf(id) < 0; });
      if (!existing.length) { notify('The built-in samples were kept.'); return; }
    } else {
      ok = await confirmDanger('Delete resources?', msg, 'Delete ' + existing.length);
      if (!ok) return;
    }
    try { await deleteResources(existing); }
    catch (e) { notify(e.message, 'error'); return; }
    existing.forEach(function (id) { mg.sel.delete(id); });
    refreshAll(); refreshManageControls(); renderManageTable();
    notify('Deleted ' + plural(existing.length, 'resource') + '.');
  }
  async function moveSelected() {
    var ids = Array.from(mg.sel).filter(function (id) { return lib.byId.has(id); });
    if (!ids.length) { notify('Select some resources first.', 'error'); return; }
    var v = $('mg-move').value;
    if (v === '__new__') {
      var name = await askDomainName();
      if (!name) return;
      await addCategories([name]);
      v = name;
    }
    var recs = ids.map(function (id) { return Object.assign({}, lib.byId.get(id), { category: v, updatedAt: Date.now() }); });
    try { await saveRecords(recs); } catch (e) { notify(e.message, 'error'); return; }
    refreshAll(); refreshManageControls(); $('mg-move').value = v; renderManageTable();
    notify('Moved ' + plural(recs.length, 'resource') + ' to ' + v + '.');
  }
  async function setSubSelected() {
    var ids = Array.from(mg.sel).filter(function (id) { return lib.byId.has(id); });
    if (!ids.length) { notify('Select some resources first.', 'error'); return; }
    var val = cleanSub($('mg-subval').value);
    var recs = ids.map(function (id) { var r = lib.byId.get(id); return Object.assign({}, r, { subDomain: canonSub(r.category, val), updatedAt: Date.now() }); });
    try { await saveRecords(recs); } catch (e) { notify(e.message, 'error'); return; }
    refreshAll(); refreshManageControls(); renderManageTable();
    notify(val ? 'Sub-domain "' + val + '" set for ' + plural(recs.length, 'resource') + '.' : 'Sub-domain cleared for ' + plural(recs.length, 'resource') + '.');
  }
  async function restoreSamples() {
    var ids = deletedSamples();
    try { await dbDeleteMany(ids); } catch (e) { notify(storageMessage(e), 'error'); return; }
    ids.forEach(function (id) { storedMap.delete(id); });
    derive(); refreshAll(); refreshManageControls(); renderManageTable();
    notify('Restored ' + plural(ids.length, 'sample resource') + '.');
  }

  async function onManageClick(e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    var tr = b.closest('tr[data-id]');
    var id = tr ? tr.getAttribute('data-id') : null;
    switch (act) {
      case 'mg-close': closeDialog($('manage-dialog')); break;
      case 'mg-edit': openEdit(id); break;
      case 'mg-delete': await deleteWithConfirm([id]); break;
      case 'mg-delete-sel': if (!mg.sel.size) notify('Select some resources first.', 'error'); else await deleteWithConfirm(Array.from(mg.sel)); break;
      case 'mg-move': await moveSelected(); break;
      case 'mg-setsub': await setSubSelected(); break;
      case 'mg-publish': publishUserEdition(); break;
      case 'mg-sel-all': manageFiltered().forEach(function (r) { mg.sel.add(r.id); }); renderManageTable(); break;
      case 'mg-sel-none': mg.sel.clear(); renderManageTable(); break;
      case 'mg-prev': mg.page = Math.max(0, mg.page - 1); renderManageTable(); break;
      case 'mg-next': mg.page += 1; renderManageTable(); break;
      case 'mg-export': exportLibrary(); break;
      case 'mg-import': $('backup-input').click(); break;
      case 'mg-restore': await restoreSamples(); break;
      default: break;
    }
  }

  /* =====================================================================
     BACKUP AND RESTORE
     ===================================================================== */
  function recordToBackup(r) {
    var o = {
      id: r.id, title: r.title, category: r.category, subDomain: r.subDomain || '', description: r.description, markdownContent: r.markdownContent, originalType: r.originalType,
      source: r.source === 'sample' ? 'sample' : 'user', filename: r.filename || '', createdAt: r.createdAt || 0, updatedAt: r.updatedAt || 0, package: null
    };
    if (isPackage(r)) {
      o.package = {
        rootName: r.package.rootName, skillFile: r.package.skillFile || 'SKILL.md',
        files: r.package.files.map(function (f) {
          var dec = decodeUtf8(f.data);
          return dec.error ? { path: f.path, encoding: 'base64', content: bytesToB64(f.data) } : { path: f.path, encoding: 'utf8', content: dec.text };
        })
      };
    }
    return o;
  }
  function buildBackupObject() {
    return {
      format: BACKUP_FORMAT, version: 1, app: 'Datacense AI Skill Library ' + APP_VERSION, exportedAt: new Date().toISOString(),
      settings: { categories: allCategories() }, deletedSampleIds: deletedSamples(),
      resources: libList().map(recordToBackup)
    };
  }
  /* Creates the User edition (no add/import/manage tools) with the current library built in. */
  function publishUserEdition() {
    try {
      if (!USER_EDITION_HTML) { notify('This copy cannot create a User edition.', 'error'); return; }
      var marker = '/*__PUBLISHED' + '__*/null';
      if (USER_EDITION_HTML.indexOf(marker) < 0) { notify('The User edition template is damaged.', 'error'); return; }
      var obj = buildBackupObject();
      var json = JSON.stringify(obj).replace(/</g, '\\u003c');
      var html = USER_EDITION_HTML.replace(marker, function () { return json; });
      var name = 'datacense-ai-skill-library.html';
      downloadBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), name);
      notify('Created ' + name + ' for users with ' + plural(obj.resources.length, 'resource') + '. Share that file; it has no admin tools.');
    } catch (err) {
      console.error(err);
      notify('Sorry, the User edition could not be created.', 'error');
    }
  }
  function exportLibrary() {
    try {
      var out = buildBackupObject();
      var json = JSON.stringify(out);
      var name = 'Datacense_Skill_Library_Backup_' + new Date().toISOString().slice(0, 10) + '.json';
      downloadBlob(new Blob([json], { type: 'application/json;charset=utf-8' }), name);
      notify('Exported ' + plural(out.resources.length, 'resource') + ' to ' + name + '.');
    } catch (err) {
      console.error(err);
      notify('Sorry, the backup could not be created.', 'error');
    }
  }

  async function onBackupFile(file) {
    var parsed;
    try {
      if (file.size > LIMITS.jsonFile) throw new ImportError('The backup is larger than ' + fmtSize(LIMITS.jsonFile) + '.');
      var dec = decodeUtf8(new Uint8Array(await readFileBuffer(file)));
      if (dec.error) throw new ImportError(dec.error + '.');
      parsed = parseBackup(dec.text);
    } catch (err) {
      notify(err instanceof ImportError ? err.message : 'The backup file could not be read.', 'error');
      return;
    }
    if (!parsed.records.length) { notify('The backup contains no valid resources' + (parsed.rejected.length ? ' (' + plural(parsed.rejected.length, 'entry', 'entries') + ' rejected)' : '') + '.', 'error'); return; }
    var info = '<p><strong>' + plural(parsed.records.length, 'resource') + '</strong>' + (parsed.exportedAt ? ' &middot; exported ' + esc(parsed.exportedAt.slice(0, 10)) : '') + '</p>' +
      (parsed.rejected.length ? '<p class="hint" style="color:var(--danger-ink)">' + plural(parsed.rejected.length, 'entry', 'entries') + ' in the file are invalid and will be ignored.</p>' : '') +
      '<p><strong>Merge</strong> adds the backup to your library and lets you review duplicates first.<br><strong>Replace</strong> deletes your current library and replaces it with the backup.</p>';
    var choice = await showConfirm({ title: 'Restore library backup', message: 'How should this backup be restored?', html: info,
      buttons: [{ label: 'Cancel', value: null, kind: 'secondary' }, { label: 'Merge', value: 'merge', kind: 'primary' }, { label: 'Replace', value: 'replace', kind: 'danger' }] });
    if (choice.value === 'merge') {
      closeDialog($('manage-dialog'));
      openDialog(addDlg);
      imp = { mode: 'detect', domain: '', defType: 'prompt', items: [], notes: [], page: 0, cancelled: false, seq: 0, backupCategories: parsed.categories.slice() };
      imp.items = parsed.records.map(function (r) { return recordToItem(r); });
      parsed.rejected.forEach(function (m) { imp.items.push(invalidItem(file.name, m)); });
      imp.notes = ['Merging "' + file.name + '". Duplicates are skipped unless you choose otherwise.'];
      markDuplicates(imp.items);
      showImportPreview();
    } else if (choice.value === 'replace') {
      var ok = await confirmDanger('Replace your whole library?', 'Your current library (' + plural(libList().length, 'resource') + ') will be deleted and replaced by the backup (' + plural(parsed.records.length, 'resource') + '). This cannot be undone.', 'Replace library');
      if (ok) await replaceLibrary(parsed);
    }
  }
  async function replaceLibrary(parsed) {
    try {
      await dbClear('resources');
      var recs = parsed.records.slice();
      var ids = {};
      recs.forEach(function (r) { ids[r.id] = true; });
      parsed.deletedSampleIds.forEach(function (id) { if (!ids[id]) recs.push({ id: id, source: 'sample', deleted: true }); });
      recs.forEach(function (r) { if (!r.deleted) r.contentHash = hashText(normForHash(r.markdownContent)); });
      await dbPutMany(recs);
      storedMap = new Map();
      recs.forEach(function (r) { storedMap.set(r.id, r); });
      customCategories = parsed.categories.filter(function (c) { return CATEGORIES.indexOf(c) < 0; });
      await dbPutMeta('categories', customCategories.slice());
      derive();
      state.category = ALL; state.query = ''; $('search').value = '';
      mg.sel.clear();
      refreshAll(); refreshManageControls(); renderManageTable();
      notify('Library restored: ' + plural(parsed.records.length, 'resource') + '.');
    } catch (e) {
      /* storage may now be partly written: reload what the browser really holds */
      try { await loadStored(); } catch (x) { /* ignore */ }
      refreshAll();
      notify(e && e.name !== 'Error' ? storageMessage(e) : (e.message || 'Restore failed.'), 'error');
    }
  }

  /* =====================================================================
     START-UP
     ===================================================================== */
  async function loadStored() {
    var recs = await dbGetAll('resources'), metas = await dbGetAll('meta');
    storedMap = new Map();
    recs.forEach(function (r) { if (r && r.id) storedMap.set(r.id, r); });
    var cm = metas.filter(function (m) { return m.key === 'categories'; })[0];
    customCategories = cm && Array.isArray(cm.value) ? cm.value.filter(function (c) { return typeof c === 'string'; }) : [];
    derive();
  }

  /* User edition: the library is whatever the administrator published (plus the built-in samples). Read-only. */
  function loadPublished() {
    storedMap = new Map();
    customCategories = [];
    if (PUBLISHED_LIBRARY) {
      try {
        var p = parseBackupObject(PUBLISHED_LIBRARY);
        p.records.forEach(function (r) { storedMap.set(r.id, r); });
        p.deletedSampleIds.forEach(function (id) { if (!storedMap.has(id)) storedMap.set(id, { id: id, source: 'sample', deleted: true }); });
        customCategories = p.categories.filter(function (c) { return CATEGORIES.indexOf(c) < 0 && c !== UNCAT; });
      } catch (e) { notify('The published library could not be read.', 'error'); }
    }
    derive();
  }

  async function init() {
    addDlg = IS_ADMIN ? $('add-dialog') : null;
    var dn = $('demo-notice');
    if (IS_ADMIN) {
      $('demo-notice-text').innerHTML = '<strong>Admin edition.</strong> Add and manage resources here. When you are ready, open Manage Resources and choose <strong>Publish for Users</strong> to create the file you share.';
      dn.hidden = false;
    } else if (SHOW_DEMO_NOTICE && !PUBLISHED_LIBRARY) {
      $('demo-notice-text').innerHTML = '<strong>Demonstration content.</strong> These are sample resources. Your administrator has not published the library yet.';
      dn.hidden = false;
    }
    derive();
    refreshAll();

    $('categories').addEventListener('click', function (e) {
      var btn = e.target.closest('.cat');
      if (!btn) return;
      state.category = btn.getAttribute('data-category');
      state.query = '';
      state.sub = '';
      state.here = false;
      $('search').value = '';
      markActiveCategory();
      renderList();
    });
    $('search').addEventListener('input', function (e) { state.query = e.target.value; if (!isSearching()) state.here = false; renderList(); });
    $('filters').addEventListener('click', function (e) {
      var tb = e.target.closest('button[data-type]'), sb = e.target.closest('button[data-sub]');
      if (tb) { state.type = tb.getAttribute('data-type'); renderList(); }
      else if (sb) { state.sub = sb.getAttribute('data-sub'); renderList(); }
    });
    $('scope-btn').addEventListener('click', function () { state.here = !state.here; renderList(); });
    $('zip-btn').addEventListener('click', downloadZip);
    $('results').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (!btn) return;
      var id = btn.getAttribute('data-id');
      if (btn.getAttribute('data-action') === 'preview') openPreview(id);
      else if (btn.getAttribute('data-action') === 'download') downloadSkill(skillById(id));
    });

    /* preview dialog */
    $('pv-download').addEventListener('click', function () { downloadSkill(currentPreviewResource()); });
    $('pv-close').addEventListener('click', closePreview);
    $('pv-copy').addEventListener('click', function () {
      var text = contentOf(currentPreviewResource());
      if (!text) { notify('Sorry, there is nothing to copy for this resource.', 'error'); return; }
      copyText(text).then(function () {
        $('pv-copy').textContent = 'Copied!';
        notify('Instructions copied to the clipboard.');
        setTimeout(function () { $('pv-copy').textContent = 'Copy Instructions'; }, 2000);
      }, function () {
        notify('Copy did not work in this browser. Please use Download .md instead.', 'error');
      });
    });

    /* user edition stops here: the rest wires the admin tools */
    if (!IS_ADMIN) {
      window.addEventListener('dragover', function (e) { e.preventDefault(); });
      window.addEventListener('drop', function (e) { e.preventDefault(); });
      $('preview').addEventListener('close', syncBodyLock);
      $('preview').addEventListener('click', function (e) { if (e.target === $('preview')) closePreview(); });
      loadPublished();
      refreshAll();
      return;
    }
    $('add-btn').addEventListener('click', openAdd);
    $('manage-btn').addEventListener('click', openManage);

    /* add / edit / manage dialogs */
    addDlg.addEventListener('click', function (e) { if (e.target === addDlg) return; onAddClick(e); });
    $('add-body').addEventListener('change', onImportChange);
    $('add-body').addEventListener('input', onImportInput);
    $('edit-dialog').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.getAttribute('data-act') === 'edit-cancel') closeDialog($('edit-dialog'));
      else if (b.getAttribute('data-act') === 'edit-save') saveEdit();
    });
    $('manage-dialog').addEventListener('click', onManageClick);
    $('manage-body').addEventListener('input', function (e) {
      if (e.target.id === 'mg-q') { mg.q = e.target.value; mg.page = 0; renderManageTable(); }
    });
    $('manage-body').addEventListener('change', function (e) {
      if (e.target.id === 'mg-domain') { mg.domain = e.target.value; mg.page = 0; renderManageTable(); }
      else if (e.target.id === 'mg-source') { mg.source = e.target.value; mg.page = 0; renderManageTable(); }
      else if (e.target.classList.contains('mg-sel')) {
        var id = e.target.closest('tr').getAttribute('data-id');
        if (e.target.checked) mg.sel.add(id); else mg.sel.delete(id);
        $('mg-selcount').textContent = mg.sel.size + ' selected';
      }
    });
    ['preview', 'add-dialog', 'edit-dialog', 'manage-dialog'].forEach(function (id) {
      $(id).addEventListener('close', syncBodyLock);
    });
    $('preview').addEventListener('click', function (e) { if (e.target === $('preview')) closePreview(); });
    addDlg.addEventListener('close', function () { if (imp) imp.cancelled = true; });

    /* file pickers */
    $('file-input').addEventListener('change', function () { var f = filesFromInput(this); this.value = ''; if (f.length) startImport(f); });
    $('folder-input').addEventListener('change', function () { var f = filesFromInput(this); this.value = ''; if (f.length) startImport(f); });
    $('backup-input').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) onBackupFile(f); });

    /* keep stray drops from navigating away from the page */
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });

    storage.db = await openDb();
    storage.available = !!storage.db;
    if (!storage.db) {
      showStorageBanner('This browser is not allowing saved storage here (for example in a private window). You can still add resources, but they will be lost when you close or refresh this page. Use Manage Resources > Export Library to keep a copy.');
    } else {
      try { await loadStored(); }
      catch (e) { showStorageBanner(storageMessage(e)); }
    }
    refreshAll();
  }

  window.__skillLibraryReady = init();
})();
</script>
</body>
</html>
